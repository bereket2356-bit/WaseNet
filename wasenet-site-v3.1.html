<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>WaseNet · Document Authentication Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F6F4;
      --surface: #FFFFFF;
      --stage: #E6EBE8;
      --ink: #1E2B30;
      --on-ink: #FFFFFF;
      --muted: #55656B;
      --line: #D9DEDB;
      --accent: #2D6A4F;
      --accent-text: #2D6A4F;
      --danger: #A8322A;
      --ok-bg: #2D6A4F;
      --warn-bg: #8A5A12;
      --header-bg: rgba(245, 246, 244, 0.75);
      --header-height: 64px;
      --font-serif: "Newsreader", Georgia, serif;
      --font-sans: "Atkinson Hyperlegible", system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #121A1D;
      --surface: #192327;
      --stage: #1F2C31;
      --ink: #E8EDEA;
      --on-ink: #121A1D;
      --muted: #A3B2AD;
      --line: #2E3D42;
      --accent: #2F7A58;
      --accent-text: #7CC9A0;
      --danger: #B9463B;
      --ok-bg: #2F7A58;
      --warn-bg: #8A5A12;
      --header-bg: rgba(18, 26, 29, 0.75);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 15px/1.55 var(--font-sans);
      letter-spacing: 0.005em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
    }
    header.top {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
    }
    .bar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-link {
      padding: 8px 14px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--ink);
      background: var(--stage);
    }
    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-report-btn {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--danger);
      background: transparent;
      color: var(--danger);
      font: inherit;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
    }
    .header-report-btn:hover {
      background: var(--danger);
      color: #fff;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    main.main-content {
      flex: 1 0 auto;
      padding-top: calc(var(--header-height, 64px) + 24px);
      padding-bottom: 48px;
    }
    /* Cards and Form Rhythm */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-sizing: border-box;
    }
    .auth-card, .issue-card, .card.narrow {
      padding: 28px;
      box-sizing: border-box;
    }
    .narrow {
      max-width: 460px;
      margin: 0 auto;
    }
    .auth-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--header-height, 64px) - 48px);
      width: 100%;
    }
    .auth-card h2, .issue-card h2 {
      margin-bottom: 16px;
    }
    .auth-card p.muted, .issue-card p.muted {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 15px;
    }
    .auth-card form, .issue-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .auth-card form > p:last-child, .issue-card > p:last-child {
      margin-top: 24px !important;
    }
    .field {
      display: grid;
      gap: 6px;
      font-weight: 700;
      text-align: left;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--on-ink);
      font: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.block { width: 100%; }
    .btn.outline {
      background: transparent;
      color: var(--ink);
    }
    .btn.sm {
      min-height: 40px;
      height: 40px;
      padding: 0 16px;
      font-size: 14px;
    }
    .btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.outline:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }
    .text-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }
    .text-btn:hover { color: var(--ink); }
    .text-btn.danger { color: var(--danger); }
    /* Document ID Row */
    .doc-id-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .doc-id-row input {
      flex: 1 1 auto;
      min-width: 0;
    }
    .doc-id-row .btn {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    /* Holder Photo Section */
    .holder-photo-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .photo-frame {
      width: 4cm;
      height: 4cm;
      border-radius: 8px;
      border: 1px solid var(--line);
      background-color: var(--stage);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .err {
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 400;
    }
    /* Result Banner & Details */
    .banner {
      padding: 28px 24px;
      color: #fff;
      border-radius: 16px;
      display: grid;
      gap: 8px;
      text-align: center;
      justify-items: center;
    }
    .banner h2 { font-size: clamp(1.8rem, 4.5vw, 2.4rem); color: #fff; }
    .banner p { font-size: 1rem; margin: 0 auto; max-width: 52ch; }
    .banner[data-s="valid"] { background: var(--ok-bg); }
    .banner[data-s="tampered"], .banner[data-s="revoked"] { background: var(--danger); }
    .banner[data-s="expired"] { background: var(--warn-bg); }
    .banner[data-s="error"] { background: var(--ink); color: var(--on-ink); }
    .rows {
      display: grid;
      gap: 0;
    }
    .rows > div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .rows > div:last-child { border-bottom: none; }
    .rows dt { color: var(--muted); }
    .rows dd { font-weight: 700; text-align: right; }
    /* Scanner Video */
    .scanner-video-box {
      position: relative;
      width: 100%;
      max-width: 440px;
      margin: 16px auto 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #000;
    }
    .scanner-video-box video {
      width: 100%;
      height: auto;
      display: block;
    }
    footer.foot {
      margin-top: 40px;
      border-top: 1px solid var(--line);
      padding: 20px 0;
      color: var(--muted);
      font-size: 13px;
      background: var(--bg);
    }
    @media (max-width: 768px) {
      .auth-card, .issue-card, .card.narrow {
        padding: 22px;
      }
    }
    /* Mobile Breakpoint: up to 620px */
    @media (max-width: 620px) {
      :root { --header-height: 110px; }
      .wrap { padding: 0 16px; }
      .bar {
        min-height: 60px;
        padding: 10px 0;
        gap: 10px;
        flex-wrap: wrap;
      }
      .brand { order: 1; margin-right: auto; }
      .tools { order: 2; }
      nav {
        order: 3;
        width: 100%;
        display: flex;
      }
      .nav-link {
        flex: 1 1 0;
        min-height: 40px;
        text-align: center;
        padding: 0 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .grid2 { grid-template-columns: 1fr; }
      .auth-card, .issue-card, .card.narrow {
        padding: 22px;
      }
      .doc-id-row {
        flex-wrap: wrap;
        gap: 8px;
      }
      .doc-id-row input { width: 100%; flex: 1 1 100%; }
      .doc-id-row .btn { width: 100%; flex: 1 1 100%; }
      .auth-stage, .auth-card, .issue-card, .verify-wrap {
        margin-top: 16px;
        margin-bottom: 16px;
      }
    }

    /* Hidden print sheet for screen */
    #print-sheet {
      display: none;
    }

    /* Print Styles */
    @page {
      size: A4;
      margin: 15mm;
    }

    @media print {
      body {
        background: #fff !important;
        color: #0F172A !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .top,
      .foot,
      #app,
      #main-content,
      #root,
      .noprint,
      button,
      .btn,
      .icon-btn {
        display: none !important;
      }
      #print-sheet {
        display: block !important;
        background: #fff !important;
        color: #0F172A !important;
        padding: 0 !important;
        margin: 0 auto !important;
        max-width: 760px !important;
        width: 100% !important;
        border: none !important;
      }
      .specimen-card,
      .ps-sheet {
        background: #FFFFFF !important;
        color: #0F172A !important;
        border: 1px solid #CBD5E1 !important;
        border-radius: 10px !important;
        box-shadow: none !important;
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 auto !important;
        padding: 34px 36px 30px !important;
        position: relative !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
        page-break-inside: avoid;
      }
      .watermark,
      .ps-wm {
        display: block !important;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-25deg);
        font-family: var(--font-sans, "Atkinson Hyperlegible", system-ui, sans-serif);
        font-size: 42px;
        font-weight: 800;
        color: rgba(220, 38, 38, 0.14) !important;
        pointer-events: none;
        user-select: none;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        white-space: nowrap;
        z-index: 1;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .sheet-header,
      .ps-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        position: relative;
        z-index: 2;
      }
      .sheet-title-block {
        flex: 1 1 auto;
        padding-top: 4px;
      }
      .sheet-title,
      .ps-head h2 {
        font-family: var(--font-sans, "Atkinson Hyperlegible", system-ui, sans-serif);
        font-size: 26px;
        font-weight: 700;
        color: #0F172A !important;
        line-height: 1.2;
        margin: 0 0 6px 0;
      }
      .sheet-subtitle,
      .ps-sub {
        font-size: 14px;
        color: #64748B !important;
        font-weight: 400;
        line-height: 1.4;
        margin: 0;
      }
      .photo-holder-4cm,
      .ps-photo {
        width: 4cm;
        height: 4cm;
        min-width: 4cm;
        min-height: 4cm;
        flex: none;
        box-sizing: border-box;
        border: 1px dashed #334155 !important;
        background: #FFFFFF !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #475569 !important;
        font-family: var(--font-sans, "Atkinson Hyperlegible", system-ui, sans-serif);
        line-height: 1.4;
        user-select: none;
        overflow: hidden;
      }
      .photo-holder-4cm.has-photo,
      .ps-photo.has-photo {
        border: 1px solid #334155 !important;
        padding: 0 !important;
      }
      .photo-holder-4cm img,
      .ps-photo img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        display: block !important;
      }
      .photo-holder-4cm .holder-title {
        font-size: 13.5px;
        font-weight: 400;
        color: #475569 !important;
      }
      .photo-holder-4cm .holder-dim {
        font-size: 12.5px;
        font-weight: 400;
        color: #475569 !important;
      }
      .sheet-divider-thick {
        width: 100%;
        height: 2px;
        background: #0F172A !important;
        margin: 20px 0 0 0;
        position: relative;
        z-index: 2;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .sheet-fields,
      .ps-grid {
        display: flex;
        flex-direction: column;
        position: relative;
        z-index: 2;
      }
      .field-row,
      .ps-field {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        padding: 14px 0;
        border-bottom: 1px solid #E2E8F0 !important;
      }
      .field-col {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .field-label,
      .ps-label {
        font-size: 13px;
        color: #64748B !important;
        font-weight: 400;
        line-height: 1.3;
      }
      .field-val,
      .ps-val {
        font-size: 16px;
        font-weight: 700;
        color: #0F172A !important;
        line-height: 1.3;
        overflow-wrap: anywhere;
        word-break: break-all;
      }
      .fan-text {
        letter-spacing: 0.02em;
      }
      .qr-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 24px;
        margin-bottom: 24px;
        position: relative;
        z-index: 2;
      }
      .qr-placeholder-box,
      .ps-qr {
        width: 112px;
        height: 112px;
        min-width: 112px;
        min-height: 112px;
        flex: none;
        box-sizing: border-box;
        border: 1px dashed #334155 !important;
        background: #FFFFFF !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 6px;
        color: #475569 !important;
        font-size: 12px;
        font-weight: 400;
        line-height: 1.35;
        user-select: none;
      }
      .qr-explanation {
        font-size: 14px;
        color: #475569 !important;
        line-height: 1.5;
        max-width: 480px;
      }
      .sheet-disclaimer-line,
      .ps-foot {
        font-size: 13px;
        color: #64748B !important;
        line-height: 1.45;
        margin-top: 8px;
        position: relative;
        z-index: 2;
      }
    }
  </style>
</head>
<body>
  <header class="top" role="banner">
    <div class="wrap bar">
      <a href="#/" class="brand" onclick="navigateTo('home')">WaseNet</a>
      <div class="tools">
        <a href="#/report" class="header-report-btn" onclick="navigateTo('report')">Report a fraud</a>
        <button type="button" class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
      <nav aria-label="Main navigation">
        <button type="button" class="nav-link" id="nav-verify" onclick="navigateTo('verify')">Verify</button>
        <button type="button" class="nav-link" id="nav-how" onclick="navigateTo('how')">How it works</button>
        <button type="button" class="nav-link" id="nav-issue" onclick="navigateTo('issue')">Issue</button>
        <a href="./wasenet-specimen-templates.html" class="nav-link">Specimens</a>
      </nav>
    </div>
  </header>

  <main class="main-content wrap" id="app">
    <!-- View Container -->
    <div id="view-container"></div>
  </main>

  <footer class="foot">
    <div class="wrap" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <p>WaseNet Document Authentication Prototype · Public Offices in Ethiopia</p>
      <p>© 2026 INSA / Ethiopian Public Administration Prototype</p>
    </div>
  </footer>

  <!-- QRCode & jsQR Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
  <script src="./lib/jsqr.js"></script>

  <div id="print-sheet" aria-hidden="true" style="display: none;"></div>
  <script>
    // State
    let currentRoute = 'home';
    let currentUser = null;
    let authMode = 'choose';
    let holderPhoto = null;
    let activeCameraStream = null;
    let currentIssuedDoc = null;

    // Document type mappings
    const DOC_TYPES = {
      land_certificate: 'Land certificate',
      cooperative_credential: 'Cooperative credential',
      birth_record: 'Birth record',
      local_permit: 'Local permit',
      dt_land: 'Land certificate',
      dt_coop: 'Cooperative credential',
      dt_birth: 'Birth record',
      dt_permit: 'Local permit',
      'Land certificate': 'Land certificate',
      'Cooperative credential': 'Cooperative credential',
      'Birth record': 'Birth record',
      'Local permit': 'Local permit'
    };

    const DOC_TYPE_TO_SCHEMA = {
      'Land certificate': 'land_certificate',
      'Cooperative credential': 'cooperative_credential',
      'Birth record': 'birth_record',
      'Local permit': 'local_permit',
      dt_land: 'land_certificate',
      dt_coop: 'cooperative_credential',
      dt_birth: 'birth_record',
      dt_permit: 'local_permit',
      land_certificate: 'land_certificate',
      cooperative_credential: 'cooperative_credential',
      birth_record: 'birth_record',
      local_permit: 'local_permit'
    };

    function getDocTypeLabel(type) {
      return DOC_TYPES[type] || type || 'Document';
    }

    function normalizeDocType(val) {
      if (!val) return '';
      return (DOC_TYPE_TO_SCHEMA[val] || String(val).toLowerCase().replace(/\s+/g, '_')).trim();
    }

    function normalizeDate(val) {
      if (!val) return '';
      return String(val).split('T')[0].trim();
    }

    // HTML escape helper
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    const esc = escapeHtml;

    function formatDateDisplay(val) {
      if (!val) return '—';
      try {
        const raw = String(val).split('T')[0].trim();
        const parts = raw.split('-');
        if (parts.length === 3) {
          const year = parseInt(parts[0], 10);
          const monthIdx = parseInt(parts[1], 10) - 1;
          const day = parseInt(parts[2], 10);
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          if (months[monthIdx] && !isNaN(day) && !isNaN(year)) {
            return `${day} ${months[monthIdx]} ${year}`;
          }
        }
      } catch (e) {}
      return String(val);
    }

    function formatFan(val) {
      const digits = String(val || '').replace(/\D/g, '').slice(0, 16);
      const parts = digits.match(/.{1,4}/g);
      return {
        digits,
        formatted: parts ? parts.join('-') : digits
      };
    }

    // ---------------- Cryptographic Helpers (RFC 7515 & RFC 8785) ---------------- //
    function base64UrlEncode(bytes) {
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    function base64UrlEncodeString(str) {
      return base64UrlEncode(new TextEncoder().encode(str));
    }

    function base64UrlDecode(base64UrlStr) {
      let base64 = base64UrlStr.replace(/-/g, '+').replace(/_/g, '/');
      while (base64.length % 4) {
        base64 += '=';
      }
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function base64UrlDecodeString(base64UrlStr) {
      return new TextDecoder().decode(base64UrlDecode(base64UrlStr));
    }

    function canonicalizeJson(obj) {
      if (obj === null || typeof obj !== 'object') {
        return JSON.stringify(obj);
      }
      if (Array.isArray(obj)) {
        return '[' + obj.map(canonicalizeJson).join(',') + ']';
      }
      const keys = Object.keys(obj).sort();
      const members = keys.map((key) => JSON.stringify(key) + ':' + canonicalizeJson(obj[key]));
      return '{' + members.join(',') + '}';
    }

    async function computeSha256(canonicalStr) {
      const data = new TextEncoder().encode(canonicalStr);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function openDatabase() {
      if (dbInstance) return Promise.resolve(dbInstance);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('publicKeys')) {
            db.createObjectStore('publicKeys', { keyPath: 'kid' });
          }
          if (!db.objectStoreNames.contains('drl')) {
            db.createObjectStore('drl', { keyPath: 'doc_id' });
          }
          if (!db.objectStoreNames.contains('issuanceQueue')) {
            db.createObjectStore('issuanceQueue', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          // Ensure default key exists
          saveKeyToDb(DEFAULT_PUBLIC_KEY).catch(() => {});
          resolve(dbInstance);
        };
        req.onerror = () => reject(req.error);
      });
    }

      const db = await openDatabase();
      return new Promise((resolve) => {
        const tx = db.transaction('publicKeys', 'readonly');

        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => resolve(null);
      });
    }

        tx.onerror = () => reject(tx.error);

    async function fetchApi(endpoint, options = {}) {
      const cleanEndpoint = endpoint.startsWith('/') ? endpoint : `/${endpoint}`;
      const opt = { ...options, headers: { ...(options.headers || {}) } };

      // Ensure Authorization header is present for document issuance/queue sync
      if (cleanEndpoint.includes('/documents') && (opt.method === 'POST' || opt.method === 'PUT')) {
        if (!opt.headers['Authorization']) {
          const token = await getAuthToken();
          if (token) {
            opt.headers['Authorization'] = `Bearer ${token}`;
          }
        }
      }

      const paths = [];

      // 1. Direct path (works through Vite proxy or same-host deployment)
      paths.push(cleanEndpoint);

      // 2. Direct OnRender backend URL
      paths.push(`${BACKEND_BASE}${cleanEndpoint}`);

      // 3. Fallback to local 5000 if running
      if (window.location.port !== '5000') {
        paths.push(`http://localhost:5000${cleanEndpoint}`);
      }

      let lastErr = null;
      for (const p of paths) {
        try {
          const res = await fetch(p, opt);
          if (res.status < 500) {
            return res;
          }
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('Network error');
    }

    // ---------------- JWS Cryptographic Verification ---------------- //
    async function verifyJwsSignature(jwsToken) {
      if (!jwsToken || typeof jwsToken !== 'string') {
        return { valid: false, error: 'Empty token format' };
      }
      let clean = jwsToken.trim();
      if (clean.includes('#')) clean = clean.split('#')[1];
      if (clean.includes('?jws=')) clean = clean.split('?jws=')[1].split('&')[0];

      const parts = clean.split('.');
      if (parts.length !== 3) {
        return { valid: false, error: 'JWS must contain 3 segments' };
      }

      const [hB64, pB64, sB64] = parts;
      let header, payload;
      try {
        header = JSON.parse(base64UrlDecodeString(hB64));
        payload = JSON.parse(base64UrlDecodeString(pB64));
      } catch (e) {
        return { valid: false, error: 'Malformed JSON payload' };
      }

      // Algorithm check: strictly ES256
      if (!header || header.alg !== 'ES256') {
        return { valid: false, docId: payload?.doc_id, error: 'Invalid algorithm' };
      }
      if (!header.kid) {
        return { valid: false, docId: payload?.doc_id, error: 'Missing kid' };
      }

      let keyRecord = await getKeyFromDb(header.kid);
      if (!keyRecord) {
        await syncKeyBundle();
        keyRecord = await getKeyFromDb(header.kid);
      }
      if (!keyRecord && header.kid === 'wase-aa-2026-01') {
        keyRecord = {
          kid: 'wase-aa-2026-01',
          jwk: {
            kty: 'EC',
            crv: 'P-256',
            x: 'w9yhsGuXcfMi8icPCbYf5GThbSMHaNBn2V5dld-5qXg',
            y: 'HJGsXkTld80puDNwogERg3Wy_USI9B9KQddoFKlll7c'
          }
        };
      }
      if (!keyRecord || !keyRecord.jwk) {
        return { valid: false, docId: payload?.doc_id, error: 'Unknown key' };
      }

      try {
        const signingInput = `${hB64}.${pB64}`;
        const inputBytes = new TextEncoder().encode(signingInput);
        const sigBytes = base64UrlDecode(sB64);

        const cryptoKey = await crypto.subtle.importKey(
          'jwk',
          keyRecord.jwk,
          { name: 'ECDSA', namedCurve: 'P-256' },
          false,
          ['verify']
        );

        const valid = await crypto.subtle.verify(
          { name: 'ECDSA', hash: { name: 'SHA-256' } },
          cryptoKey,
          sigBytes,
          inputBytes
        );

        return { valid: Boolean(valid), payload, header, docId: payload?.doc_id };
      } catch (err) {
        return { valid: false, docId: payload?.doc_id, error: err.message };
      }
    }

    async function decodePdfFile(file) {
      const pdfjs = await loadPdfJs();
      const arrayBuffer = await file.arrayBuffer();
      let pdfDoc;
      try {
        const loadingTask = pdfjs.getDocument({ data: arrayBuffer });
        pdfDoc = await loadingTask.promise;
      } catch (err) {
        throw new Error('PDF_OPEN_ERROR');
      }

      try {
        const maxPages = Math.min(pdfDoc.numPages, 3);
        for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          for (const scale of [3.0, 2.0]) {
            const viewport = page.getViewport({ scale });
            const offscreenCanvas = document.createElement('canvas');
            offscreenCanvas.width = Math.round(viewport.width);
            offscreenCanvas.height = Math.round(viewport.height);
            const ctx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

            // Fill white background first so transparent PDF regions are contrasted
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);

            await page.render({ canvasContext: ctx, viewport }).promise;

            const rawImg = ctx.getImageData(0, 0, offscreenCanvas.width, offscreenCanvas.height);
            const d = rawImg.data;
            for (let i = 0; i < d.length; i += 4) {
              const a = d[i + 3] / 255;
              if (a < 1) {
                d[i] = Math.round(d[i] * a + 255 * (1 - a));
                d[i + 1] = Math.round(d[i + 1] * a + 255 * (1 - a));
                d[i + 2] = Math.round(d[i + 2] * a + 255 * (1 - a));
                d[i + 3] = 255;
              }
            }

            // Step 1: Bottom-left quadrant (where specimen QR box is located)
            const bhY = Math.round(offscreenCanvas.height * 0.40);
            const bhH = offscreenCanvas.height - bhY;
            const qW = Math.round(offscreenCanvas.width * 0.65);
            const blImg = ctx.getImageData(0, bhY, qW, bhH);
            let decoded = multiStepDecode(blImg, qW, bhH);
            if (decoded) return decoded;

            // Step 2: Bottom half (standard for certificate QR codes)
            const bhImg = ctx.getImageData(0, bhY, offscreenCanvas.width, bhH);
            decoded = multiStepDecode(bhImg, offscreenCanvas.width, bhH);
            if (decoded) return decoded;

            // Step 3: Full frame with dual inversion
            decoded = multiStepDecode(rawImg, offscreenCanvas.width, offscreenCanvas.height);
            if (decoded) return decoded;
          }
        }
        return null;
      } finally {
        if (pdfDoc && typeof pdfDoc.destroy === 'function') {
          await pdfDoc.destroy();
        }
      }
    }

    async function generateQrDataUrl(text, minPixels = 240) {
      const qrcode = await loadQrCodeLib();
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const moduleCount = qr.getModuleCount();
      const margin = 4;
      const totalModules = moduleCount + margin * 2;
      const cellSize = Math.max(3, Math.ceil(minPixels / totalModules));
      return qr.createDataURL(cellSize, margin);
    }

    async function generateQrSvg(text, minPixels = 240) {
      const qrcode = await loadQrCodeLib();
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const moduleCount = qr.getModuleCount();
      const margin = 4; // Quiet zone of at least 4 modules
      const totalModules = moduleCount + margin * 2;
      const cellSize = Math.max(3, Math.ceil(minPixels / totalModules));
      return qr.createSvgTag(cellSize, margin);
    }

    function processPhotoFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const minDim = Math.min(img.width, img.height);
            const sx = (img.width - minDim) / 2;
            const sy = (img.height - minDim) / 2;
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 400;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, 400, 400);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = () => reject(new Error('Image decode error'));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error('File read error'));
        reader.readAsDataURL(file);
      });
    }

    // Four-step QR decoder (SRS item 6)
    function multiStepDecode(imageData, w, h) {
      if (!window.jsQR) return null;
      // 1. Full frame with dual inversion
      let code = window.jsQR(imageData.data, w, h, { inversionAttempts: 'attemptBoth' });
      if (code && code.data) return code.data;

      // 2. Centered crop (central 70%)
      const cw = Math.max(1, Math.round(w * 0.7));
      const ch = Math.max(1, Math.round(h * 0.7));
      const cx = Math.max(0, Math.round((w - cw) / 2));
      const cy = Math.max(0, Math.round((h - ch) / 2));
      const cropBuf = new Uint8ClampedArray(cw * ch * 4);
      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const srcIdx = ((cy + y) * w + (cx + x)) * 4;
          const dstIdx = (y * cw + x) * 4;
          cropBuf[dstIdx] = imageData.data[srcIdx];
          cropBuf[dstIdx+1] = imageData.data[srcIdx+1];
          cropBuf[dstIdx+2] = imageData.data[srcIdx+2];
          cropBuf[dstIdx+3] = imageData.data[srcIdx+3];
        }
      }
      code = window.jsQR(cropBuf, cw, ch, { inversionAttempts: 'attemptBoth' });
      if (code && code.data) return code.data;

      // 3. Downscaled copy
      if (w > 600 || h > 600) {
        const dw = Math.floor(w / 2);
        const dh = Math.floor(h / 2);
        const downBuf = new Uint8ClampedArray(dw * dh * 4);
        for (let y = 0; y < dh; y++) {
          for (let x = 0; x < dw; x++) {
            const srcIdx = (y * 2 * w + x * 2) * 4;
            const dstIdx = (y * dw + x) * 4;
            downBuf[dstIdx] = imageData.data[srcIdx];
            downBuf[dstIdx+1] = imageData.data[srcIdx+1];
            downBuf[dstIdx+2] = imageData.data[srcIdx+2];
            downBuf[dstIdx+3] = imageData.data[srcIdx+3];
          }
        }
        code = window.jsQR(downBuf, dw, dh, { inversionAttempts: 'attemptBoth' });
        if (code && code.data) return code.data;
      }

      // 4. Inverted copy
      const invBuf = new Uint8ClampedArray(imageData.data);
      for (let i = 0; i < invBuf.length; i += 4) {
        invBuf[i] = 255 - invBuf[i];
        invBuf[i+1] = 255 - invBuf[i+1];
        invBuf[i+2] = 255 - invBuf[i+2];
        invBuf[i+3] = 255;
      }
      code = window.jsQR(invBuf, w, h, { inversionAttempts: 'dontInvert' });
      if (code && code.data) return code.data;

      return null;
    }

    // ---------------- Unified Verification Pipeline (Requirement 2) ---------------- //
    async function handleVerifyQr(jwsToken) {
      const container = document.getElementById('view-container');
      if (container) {
        container.innerHTML = `
          <div style="max-width:540px; margin:40px auto; text-align:center;">
            <h2>Checking document...</h2>
            <p class="muted" style="margin-top:8px;">Verifying cryptographic signature and retrieving central record.</p>
          </div>
        `;
      }

      // Check 1: JWS signature check ALWAYS runs first
      const sigResult = await verifyJwsSignature(jwsToken);
      if (!sigResult.valid) {
        navigateTo('result', {
          status: 'tampered',
          docId: sigResult.docId || 'unknown',
          note: 'Details are hidden because the signature did not match.',
          detailsHidden: true
        });
        return;
      }

      const payload = sigResult.payload || {};
      const docId = payload.doc_id || payload.id;

      // Check 2: Online record fetch
      let isOnline = navigator.onLine;
      let dbRecord = null;
      let notInRecords = false;

      if (isOnline) {
        try {
          const res = await fetchApi(`/api/v1/documents/${encodeURIComponent(docId)}`);
          if (res.status === 404) {
            notInRecords = true;
          } else if (res.ok) {
            dbRecord = await res.json();
          } else {
            isOnline = false;
          }
        } catch (netErr) {
          isOnline = false;
        }
      }

      // If online and server has no record -> Unconfirmed note, NEVER valid
      if (notInRecords) {
        navigateTo('result', {
          status: 'error',
          title: 'Not in records',
          desc: "This document is not in the WaseNet records. Do not accept it until it is confirmed.",
          note: "This document is not in the WaseNet records. Do not accept it until it is confirmed.",
          docId: docId,
          detailsHidden: true
        });
        return;
      }

      if (isOnline && dbRecord) {
        // Compare key fields: Document ID, document type, holder name, and expiry date
        const typeMatch = normalizeDocType(dbRecord.doc_type) === normalizeDocType(payload.doc_type || payload.type);
        const idMatch = String(dbRecord.id).toLowerCase() === String(docId).toLowerCase();
        const nameMatch = String(dbRecord.holder_name || '').trim().toLowerCase() === String(payload.holder_name || '').trim().toLowerCase();
        const expMatch = normalizeDate(dbRecord.expiry_date) === normalizeDate(payload.expiry_date || payload.expires_at);

        if (!typeMatch || !idMatch || !nameMatch || !expMatch) {
          navigateTo('result', {
            status: 'tampered',
            docId: docId,
            note: "This document's details do not match its signed record.",
            detailsHidden: true
          });
          return;
        }

        // Check revocation then expiry in that order
        let isRevoked = dbRecord.sync_state === 'revoked';
        if (!isRevoked) {
          try {
            const revRes = await fetchApi('/api/v1/revocations');
            if (revRes.ok) {
              const revData = await revRes.json();
              isRevoked = (revData.delta || []).some(r => r.doc_id === docId);
            }
          } catch (e) {}
        }

        if (isRevoked) {
          navigateTo('result', {
            status: 'revoked',
            doc: dbRecord,
            docId: docId
          });
          return;
        }

        const expDate = new Date(dbRecord.expiry_date);
        if (!isNaN(expDate.getTime()) && expDate.getTime() < Date.now()) {
          navigateTo('result', {
            status: 'expired',
            doc: dbRecord,
            docId: docId
          });
          return;
        }

        // Valid with DB record
        navigateTo('result', {
          status: 'valid',
          doc: dbRecord,
          docId: docId
        });
        return;
      }

      // Offline: server cannot be reached
      const isRevokedOffline = await isDocRevokedInDb(docId);
      if (isRevokedOffline) {
        navigateTo('result', {
          status: 'revoked',
          doc: payload,
          docId: docId,
          offline: true
        });
        return;
      }

      const expDateOffline = new Date(payload.expiry_date || payload.expires_at);
      if (!isNaN(expDateOffline.getTime()) && expDateOffline.getTime() < Date.now()) {
        navigateTo('result', {
          status: 'expired',
          doc: payload,
          docId: docId,
          offline: true
        });
        return;
      }

      navigateTo('result', {
        status: 'valid',
        doc: payload,
        docId: docId,
        offline: true
      });
    }

          const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'application/pdf'];
          const ext = (file.name || '').split('.').pop()?.toLowerCase();

                  <span>Document type</span>
                  <select name="docType" id="issue-doc-type">
                    <option value="Land certificate">Land certificate</option>
                    <option value="Cooperative credential">Cooperative credential</option>
                    <option value="Birth record">Birth record</option>
                    <option value="Local permit">Local permit</option>
                  </select>
                </label>
                <label class="field">
                  <span>Holder full name</span>
                  <input name="holder" required />
                </label>
                <label class="field">
                  <span>Holder national ID (FAN)</span>
                  <input name="holderId" id="fan-input" placeholder="xxxx-xxxx-xxxx-xxxx" inputmode="numeric" required />
                  <p id="fan-error" class="err" style="display:none; margin-top:4px;">Enter all 16 digits of the national ID.</p>
                </label>

                <!-- Holder Photo Upload (SRS 4.1 Data Minimization) -->
                <div class="holder-photo-section">
                  <input type="file" id="photo-file-input" accept="image/jpeg,image/png,image/webp" style="display:none;" aria-label="Upload holder photo" />
                  <div id="photo-btn-wrap">
                    <button type="button" class="btn outline" style="min-height:48px; height:48px;" onclick="document.getElementById('photo-file-input').click()">
                      Choose a photo
                    </button>
                  </div>
                  <div id="photo-preview-wrap" style="display:none; flex-direction:column; gap:8px;">
                    <div class="photo-frame">
                      <img id="photo-preview-img" src="" alt="Holder portrait preview" />
                    </div>
                    <button type="button" class="text-btn danger" onclick="removePhoto()" style="align-self:flex-start;">Remove photo</button>
                  </div>
                  <p id="photo-error" class="err" style="display:none; margin-top:4px;"></p>
                  <div id="photo-live-announcer" aria-live="polite" class="sr-only"></div>
                </div>

                <div class="grid2">
                  <label class="field"><span>Issue date</span><input name="issued" type="date" value="${new Date().toISOString().split('T')[0]}" required /></label>
                  <label class="field"><span>Expiry date</span><input name="expires" type="date" value="${new Date(Date.now() + 5*365*24*3600*1000).toISOString().split('T')[0]}" required /></label>
                </div>
                <label class="field">
                  <span>Issuer code</span>
                  <input name="issuer" value="ET-AA-LAND-04" required />
                </label>
                <p style="margin-top:24px;">
                  <button class="btn block" type="submit" id="btn-submit-issue">Sign and create document</button>
                </p>
                <p id="issue-error-msg" class="err" style="display:none; margin-top:12px;"></p>
              </form>
            </div>
          `;

          // Fan input logic: numeric keypad, auto-hyphens every 4 digits, max 16 digits
          const fanInput = document.getElementById('fan-input');
          fanInput.addEventListener('input', (e) => {
            const raw = e.target.value;
            const clean = raw.replace(/\D/g, '').slice(0, 16);
            const parts = clean.match(/.{1,4}/g);
            e.target.value = parts ? parts.join('-') : clean;
            document.getElementById('fan-error').style.display = 'none';
          });

          // Photo input handler
          const photoInput = document.getElementById('photo-file-input');
          photoInput.addEventListener('change', async (e) => {
            const file = e.target.files?.[0];
            if (!file) return;
            const errEl = document.getElementById('photo-error');
            const liveEl = document.getElementById('photo-live-announcer');
            errEl.style.display = 'none';

            const allowed = ['image/jpeg', 'image/png', 'image/webp'];
            const ext = (file.name || '').split('.').pop()?.toLowerCase();
            const isExt = ['jpg', 'jpeg', 'png', 'webp'].includes(ext);

            if ((!allowed.includes(file.type) && !isExt) || file.size > 2 * 1024 * 1024) {
              const msg = 'Choose a JPG, PNG, or WebP image under 2 MB.';
              errEl.textContent = msg;
              errEl.style.display = 'block';
              liveEl.textContent = msg;
              e.target.value = '';
              return;
            }

            try {
              const dataUrl = await processPhotoFile(file);
              holderPhoto = dataUrl;
              document.getElementById('photo-preview-img').src = dataUrl;
              document.getElementById('photo-btn-wrap').style.display = 'none';
              document.getElementById('photo-preview-wrap').style.display = 'flex';
              liveEl.textContent = `Photo chosen: ${file.name}`;
            } catch (err) {
              errEl.textContent = 'Choose a JPG, PNG, or WebP image under 2 MB.';
              errEl.style.display = 'block';
            }
          });
        }
      } else if (route === 'how') {
        container.innerHTML = `
          <div style="max-width:720px; margin:0 auto;">
            <h1>How WaseNet works</h1>
            <p class="muted" style="margin:16px 0 28px;">A hybrid offline-first public document authentication system designed for Ethiopian public administrations.</p>
            <div class="card" style="padding:28px; display:flex; flex-direction:column; gap:20px;">
              <div>
                <h3>1. Cryptographic Document Issuance</h3>
                <p class="muted" style="margin-top:6px;">Public authorities sign credential metadata using elliptic curve cryptography (ECDSA P-256) producing a compact JWS token encoded in a Level M QR code.</p>
              </div>
              <div>
                <h3>2. Zero-Network Verification</h3>
                <p class="muted" style="margin-top:6px;">Inspectors verify documents offline on Android devices using locally cached Public Key Bundles and compact Document Revocation Lists (DRL).</p>
              </div>
              <div>
                <h3>3. Data Minimization & Privacy (SRS 4.1)</h3>
                <p class="muted" style="margin-top:6px;">Personal identifier fields are restricted to administrative necessity. Biometric photos are cropped locally and linked to the document without bloating the JWS signature.</p>
              </div>
            </div>
          </div>
        `;
      } else if (route === 'report') {
        const prefillDocId = params.docId || '';
        container.innerHTML = `
          <div style="max-width:540px; margin:0 auto;">
            <h1>Report a fraud</h1>
            <p class="muted" style="margin:16px 0 24px;">Report suspected fraudulent, tampered, or forged credentials directly to INSA cybersecurity operations.</p>
            <form class="card" style="padding:28px; display:flex; flex-direction:column; gap:16px;" onsubmit="alert('Report submitted to INSA audit queue.'); navigateTo('home'); return false;">
              <label class="field"><span>Document ID</span><input name="docId" value="${escapeHtml(prefillDocId)}" required /></label>
              <label class="field"><span>Reason for report</span>
                <select name="reason">
                  <option>Suspected signature forgery</option>
                  <option>Physical alteration of text</option>
                  <option>Revoked certificate used unlawfully</option>
                </select>
              </label>
              <label class="field"><span>Details</span><textarea rows="4" required></textarea></label>
              <p style="margin-top:24px;"><button class="btn block" type="submit">Submit report</button></p>
            </form>
          </div>
        `;
      } else if (route === 'contact') {
        container.innerHTML = `
          <div style="max-width:640px; margin:0 auto;">
            <h1>Contact us</h1>
            <p class="muted" style="margin:10px 0 24px;">Questions about a document, a result, or using WaseNet? Reach the team below.</p>
            <div style="display:flex; flex-direction:column; gap:16px;">
              <div class="card" style="padding:24px;">
                <h3 style="margin-bottom:8px;">Fraud and identity reports</h3>
                <p style="font-weight:700; margin-bottom:6px;">Information Network Security Administration (INSA)</p>
                <p class="muted" style="font-size:14.5px; line-height:1.5; margin-bottom:12px;">
                  For digital or cyber-related document and identity authentication issues, reach INSA through the service below.
                </p>
                <a class="btn outline sm" href="https://www.insa.gov.et/service/Fraud-Prevention-Service" target="_blank" rel="noopener noreferrer">
                  INSA Fraud Prevention Service
                </a>
              </div>
              <div class="card" style="padding:24px;">
                <h3 style="margin-bottom:8px;">Support hours</h3>
                <p class="muted" style="margin:0;">Monday to Friday, 8:30 to 17:00</p>
              </div>
            </div>
            <div style="margin-top:32px; text-align:center;">
              <button class="btn outline danger" onclick="navigateTo('report')">Report a fraud</button>
            </div>
          </div>
        `;
      } else {
        // Home
        container.innerHTML = `
          <div style="text-align:center; padding:32px 0;">
            <h1 style="font-size:clamp(2.2rem, 5vw, 3.2rem); font-family:var(--font-serif); margin-bottom:16px;">Check a document in one scan</h1>
            <p class="muted" style="max-width:50ch; margin:0 auto 32px; font-size:1.1rem;">
              WaseNet gives Ethiopian public authorities instant, verifiable document credentials with offline-ready ECDSA cryptographic signatures.
            </p>
            <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
              <button class="btn" onclick="navigateTo('verify')" style="min-height:48px; min-width:180px;">Scan a document</button>
              <button class="btn outline" onclick="navigateTo('issue')" style="min-height:48px; min-width:180px;">Issue credentials</button>
            </div>
          </div>
        `;
      }
    }

    function removePhoto() {
      holderPhoto = null;
      document.getElementById('photo-preview-wrap').style.display = 'none';
      document.getElementById('photo-btn-wrap').style.display = 'block';
      const fileInp = document.getElementById('photo-file-input');
      if (fileInp) fileInp.value = '';
      const liveEl = document.getElementById('photo-live-announcer');
      if (liveEl) liveEl.textContent = 'Photo removed.';
    }

    function setAuth(mode) {
      authMode = mode;
      renderView('issue');
    }

    function handleRegister(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      currentUser = { name: fd.get('name'), role: fd.get('role'), org: fd.get('org') };
      renderView('issue');
    }

    function handleLogin(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      currentUser = { name: fd.get('u'), role: 'issuer', org: 'Addis Ababa Sub-city Office 04' };
      renderView('issue');
    }

    // ---------------- Document Issuance Pipeline (Requirement 1) ---------------- //
    async function handleIssueDoc(e) {
      e.preventDefault();
      const fanInp = document.getElementById('fan-input');
      const cleanFan = (fanInp.value || '').replace(/\D/g, '');
      const errEl = document.getElementById('issue-error-msg');
      if (errEl) errEl.style.display = 'none';

      if (cleanFan.length !== 16) {
        document.getElementById('fan-error').style.display = 'block';
        fanInp.focus();
        return;
      }

      const form = e.target;
      const rawDocType = form.docType.value;
      const mappedDocType = DOC_TYPE_TO_SCHEMA[rawDocType] || 'land_certificate';
      const holder = form.holder.value;
      // Retain device-generated Document ID across retries (FR-2.1)
      const docId = form.docId.value;
      const issuerCode = form.issuer ? form.issuer.value : 'ET-AA-DOC-01';
      const issueDate = form.issued ? form.issued.value : new Date().toISOString().split('T')[0];
      const expiryDate = form.expires ? form.expires.value : new Date(Date.now() + 5*365*24*3600*1000).toISOString().split('T')[0];

      const submitBtn = document.getElementById('btn-submit-issue');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving document...';
      }

      currentIssuedDoc = {
        doc_id: docId,
        type: rawDocType,
        doc_type: mappedDocType,
        holder_name: holder,
        holder_id: cleanFan,
        issuer_code: issuerCode,
        issued_at: issueDate,
        expires_at: expiryDate,
        photo: holderPhoto
      };

      const isOnline = navigator.onLine;

      if (isOnline) {
        try {
          const reqPayload = {
            id: docId,
            doc_type: mappedDocType,
            holder_name: holder,
            holder_national_id: cleanFan,
            issue_date: issueDate,
            expiry_date: expiryDate,
            attributes: {}
          };

          const res = await fetchApi('/api/v1/documents', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(reqPayload)
          });

          if (!res.ok) {
            throw new Error('Save failed');
          }

          const serverDoc = await res.json();
          renderCreatedView(serverDoc.qr_payload, 'Created and synced', rawDocType, holder, cleanFan, docId);
          return;
        } catch (saveErr) {
          // Keep form values and display error message
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign and create document';
          }
          if (errEl) {
            errEl.textContent = 'The document could not be saved. Try again.';
            errEl.style.display = 'block';
          }
          return;
        }
      }

      // Offline Issuance: store in IndexedDB issuanceQueue with state 'queued'
      try {
        const payloadDict = {
          doc_id: docId,
          doc_type: mappedDocType,
          issuer_id: 'ET-AA-DOC-01',
          kid: 'wase-aa-2026-01',
          issue_date: issueDate,
          expiry_date: expiryDate,
          holder_name: holder,
          attributes: {}
        };
        const canonicalPayload = canonicalizeJson(payloadDict);
        const sha256Hex = await computeSha256(canonicalPayload);

        // Compact JWS serialization
        const header = { alg: 'ES256', kid: 'wase-aa-2026-01', typ: 'JWT' };
        const hB64 = base64UrlEncodeString(JSON.stringify(header));
        const pB64 = base64UrlEncodeString(canonicalPayload);
        const offlineJws = `${hB64}.${pB64}.offline_sig`;

        const queueItem = {
          id: docId,
          doc_type: mappedDocType,
          kid: 'wase-aa-2026-01',
          issue_date: issueDate,
          expiry_date: expiryDate,
          payload_canonical: canonicalPayload,
          jws: offlineJws,
          payload_sha256: sha256Hex,
          holder_name: holder,
          holder_national_id: cleanFan, // securely in IndexedDB, never localStorage
          state: 'queued',
          createdAt: new Date().toISOString()
        };

        await putQueueItem(queueItem);
        renderCreatedView(offlineJws, 'Waiting to sync', rawDocType, holder, cleanFan, docId);
      } catch (offlineErr) {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign and create document';
        }
        if (errEl) {
          errEl.textContent = 'The document could not be saved. Try again.';
          errEl.style.display = 'block';
        }
      }
    }

    async function renderCreatedView(qrPayload, syncLabel, docType, holder, cleanFan, docId) {
      const container = document.getElementById('view-container');
      const isQueued = syncLabel.includes('Waiting');
      container.innerHTML = `
        <div style="max-width:560px; margin:0 auto;" class="card narrow issue-card">
          <h2>Document created</h2>
          <div style="margin:8px 0 16px;">
            <span style="display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; font-size:13px; ${isQueued ? 'background:var(--warn-bg); color:#fff;' : 'background:var(--ok-bg); color:#fff;'}">
              ${escapeHtml(syncLabel)}
            </span>
          </div>
          ${holderPhoto ? `
            <div style="display:flex; justify-content:center; margin:16px 0;">
              <div class="photo-frame">
                <img src="${holderPhoto}" alt="Holder portrait" />
              </div>
            </div>
          ` : ''}
          <dl class="rows" style="margin-top:16px;">
            <div><dt>Document type</dt><dd>${escapeHtml(docType)}</dd></div>
            <div><dt>Holder name</dt><dd>${escapeHtml(holder)}</dd></div>
            <div><dt>Holder national ID (FAN)</dt><dd>${formatFan(cleanFan).formatted}</dd></div>
            <div><dt>Document ID</dt><dd>${escapeHtml(docId)}</dd></div>
          </dl>
          <div id="created-qr-wrap" style="display:flex; justify-content:center; align-items:center; margin:20px auto; min-width:240px; min-height:240px;">
            <p class="muted">Generating secure QR code...</p>
          </div>
          <p id="created-print-err" class="err" role="alert" style="margin-top:10px; display:none; text-align:center;"></p>
          <div style="display:flex; justify-content:center; gap:12px; margin-top:20px;">
            <button class="btn outline" type="button" id="btn-print-doc" onclick="printIssuedDoc()">Print</button>
            <button class="btn" type="button" onclick="navigateTo('issue')">Issue another</button>
          </div>
        </div>
      `;

      try {
        const svgMarkup = await generateQrSvg(qrPayload, 240);
        const wrap = document.getElementById('created-qr-wrap');
        if (wrap) {
          wrap.innerHTML = svgMarkup;
          const svgEl = wrap.querySelector('svg');
          if (svgEl) {
            svgEl.style.width = '240px';
            svgEl.style.height = '240px';
            svgEl.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Failed to generate created QR code:', err);
      }
    }

    function navigateTo(route, params = {}) {
      if (route === 'issue') {
        currentIssuedDoc = null;
      }
      currentRoute = route;
      window.location.hash = '#/' + route;
      renderView(route, params);
      window.scrollTo(0, 0);
    }

    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      currentRoute = hash || 'home';
      renderView(currentRoute);
    });

    // Measure header height and adjust --header-height
    function updateHeaderHeight() {
      const headerEl = document.querySelector('header.top');
      if (headerEl) {
        document.documentElement.style.setProperty('--header-height', `${headerEl.offsetHeight}px`);
      }
    }
    window.addEventListener('resize', updateHeaderHeight);
    updateHeaderHeight();

    // Initial render
    const initialRoute = window.location.hash.replace(/^#\/?/, '').split('?')[0] || 'home';
    renderView(initialRoute);
  </script>
</body>
</html>
