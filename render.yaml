services:
  - type: web
    name: wasenet-backend
    runtime: python
    rootDir: backend
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://wase-net.vercel.app,http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET
        generateValue: true
      - key: AES_GCM_SECRET_KEY
        generateValue: true
      - key: ACTIVE_KID
        value: wase-aa-2026-01
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
