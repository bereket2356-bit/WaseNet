version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: wasenet_db
    restart: always
    environment:
      POSTGRES_DB: wasenet_db
      POSTGRES_USER: wasenet_user
      POSTGRES_PASSWORD: wasenet_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasenet_user -d wasenet_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasenet_migration
    restart: "no"
    command: sh -c "alembic upgrade head && python scripts/seed.py"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://wasenet_user:wasenet_pass@db:5432/wasenet_db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasenet_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://wasenet_user:wasenet_pass@db:5432/wasenet_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
